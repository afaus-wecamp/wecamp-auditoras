<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>WECAMP · Auditorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg: #12201A;
  --bg-alt: #0D1712;
  --surface: #1B2C24;
  --surface-2: #22392E;
  --line: #2E4437;
  --text: #F1EFE6;
  --text-dim: #A9BBAF;
  --text-faint: #6E8579;
  --moss: #7FA65A;
  --moss-bright: #9AC96D;
  --rust: #C4573D;
  --rust-bright: #DB6B4E;
  --amber: #D9A441;
  --amber-bright: #EFC468;
  --focus: #EFC468;
  --radius: 14px;
  --font-display: 'Archivo', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--amber); color: #14201A; }
button{ font-family: inherit; cursor:pointer; }
:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* topographic backdrop */
.topo-bg{
  position: fixed; inset:0; z-index:-1; opacity:0.16; pointer-events:none;
  background-image:
    repeating-radial-gradient(circle at 12% 18%, transparent 0, transparent 26px, rgba(127,166,90,0.5) 27px, transparent 28px, transparent 54px),
    repeating-radial-gradient(circle at 85% 75%, transparent 0, transparent 34px, rgba(217,164,65,0.35) 35px, transparent 36px, transparent 70px);
  background-color: var(--bg);
}

#root{ max-width: 880px; margin:0 auto; padding-bottom: 120px; }

/* HEADER */
header.top{
  position: sticky; top:0; z-index: 20;
  background: linear-gradient(180deg, var(--bg-alt) 0%, rgba(13,23,18,0.94) 82%, rgba(13,23,18,0));
  padding: 18px 18px 10px;
  backdrop-filter: blur(6px);
}
.wordmark{
  font-family: var(--font-display); font-weight:800; font-size: 20px; letter-spacing:0.02em;
  display:flex; align-items:baseline; gap:8px; color: var(--text);
}
.wordmark .dot{ color: var(--amber-bright); }
.wordmark small{ font-family: var(--font-mono); font-weight:500; font-size:11px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase; }

.tabs{ display:flex; gap:6px; margin-top:14px; background: var(--surface); border:1px solid var(--line); border-radius: 999px; padding:4px; }
.tab{
  flex:1; text-align:center; padding:9px 6px; border-radius:999px; border:none; background:transparent;
  color: var(--text-dim); font-weight:600; font-size:12.5px; letter-spacing:0.01em;
  transition: background .15s ease, color .15s ease; white-space:nowrap;
}
.tab.active{ background: var(--moss); color:#0E1B12; }
.tab-badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
  background: var(--amber-bright); color:#2A1E04; border-radius:999px; font-family:var(--font-mono); font-size:10.5px; font-weight:700;
  vertical-align:middle; margin-left:2px;
}

main{ padding: 6px 18px 40px; }

/* CARD */
.card{
  background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px;
}
.card-title{ font-family: var(--font-display); font-weight:700; font-size:15px; color:var(--text); margin:0 0 10px; letter-spacing:0.01em; }

/* DASHBOARD SUMMARY */
.summary-row{ display:flex; gap:10px; margin-bottom:14px; }
.stat{
  flex:1; background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
  padding: 14px 12px; text-align:left;
}
.stat .num{ font-family: var(--font-mono); font-size: 24px; font-weight:600; color: var(--amber-bright); line-height:1; }
.stat .label{ font-size:11px; color: var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:6px; }

/* HEATMAP TABLE */
.matrix-wrap{ overflow-x:auto; border-radius: var(--radius); border:1px solid var(--line); }
table.matrix{ border-collapse: collapse; width:100%; min-width: 720px; background: var(--surface); }
table.matrix th, table.matrix td{ padding:0; }
table.matrix thead th{
  position: sticky; top:0; background: var(--surface-2); z-index:5;
  font-family: var(--font-mono); font-size:10.5px; color: var(--text-dim); font-weight:600;
  padding: 10px 6px; text-align:center; letter-spacing:0.02em; border-bottom:1px solid var(--line);
}
table.matrix thead th.corner{ text-align:left; padding-left:14px; position:sticky; left:0; z-index:6; background: var(--surface-2); }
table.matrix tbody th{
  position:sticky; left:0; background: var(--surface); z-index:4;
  text-align:left; padding:10px 12px; font-weight:600; font-size:13px; color:var(--text);
  border-right:1px solid var(--line); border-bottom:1px solid var(--line); white-space:nowrap;
}
table.matrix tbody td{ border-bottom:1px solid var(--line); text-align:center; padding:6px; }
.cell-btn{
  width:100%; height:44px; border:none; border-radius:8px; font-family:var(--font-mono); font-weight:600; font-size:12.5px;
  display:flex; align-items:center; justify-content:center; color:#0E1B12; transition: transform .1s ease;
}
.cell-btn:not(:disabled):active{ transform: scale(0.94); }
.cell-btn:disabled{ cursor:default; }
.cell-empty{ background: rgba(255,255,255,0.04); color: var(--text-faint); border:1px dashed var(--line); }
.cell-good{ background: var(--moss-bright); }
.cell-mid{ background: var(--amber); }
.cell-bad{ background: var(--rust-bright); }
.cell-excel{ background: var(--surface-2); border:1px solid var(--amber); color: var(--amber-bright); font-size:16px; }
.cell-excel:not(:disabled):hover{ background: rgba(217,164,65,0.15); }
.overall-col{ font-family: var(--font-mono); font-weight:700; }

.legend{ display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; }
.legend span{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); }
.legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

/* SELECT / FORM CONTROLS */
label.field-label{ display:block; font-size:11.5px; color: var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; font-weight:600; }
select, input[type=text]{
  width:100%; background: var(--surface-2); border:1px solid var(--line); color: var(--text);
  padding: 13px 12px; border-radius:10px; font-size:15px; font-family: var(--font-body); appearance:none;
}
.field{ margin-bottom:14px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.btn{
  border:none; border-radius:10px; padding:14px 18px; font-weight:700; font-size:14.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary{ background: var(--moss); color:#0E1B12; }
.btn-primary:disabled{ background: var(--surface-2); color: var(--text-faint); }
.btn-ghost{ background: transparent; border:1px solid var(--line); color: var(--text-dim); }
.btn-outline-amber{ background: transparent; border:1px solid var(--amber); color: var(--amber-bright); }

/* PICKER SCREEN */
.picker-list{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
.pick-chip{
  background: var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 6px;
  color: var(--text); font-weight:600; font-size:13px; text-align:center;
}
.pick-chip.sel{ background: var(--moss); color:#0E1B12; border-color: var(--moss); }
.pick-chip .sub{ display:block; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:3px; font-weight:500; }
.pick-chip.sel .sub{ color: #123016; }

/* QUESTIONNAIRE */
.progress-bar-wrap{ position: sticky; top: 96px; z-index:15; background: var(--bg); padding: 8px 0 12px; }
.progress-track{ height:8px; background: var(--surface-2); border-radius:999px; overflow:hidden; border:1px solid var(--line); }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--moss), var(--amber-bright)); transition: width .25s ease; }
.progress-text{ font-family: var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:6px; display:flex; justify-content:space-between; }

.cat-heading{
  font-family: var(--font-display); font-weight:700; font-size:12.5px; color: var(--amber-bright);
  text-transform: uppercase; letter-spacing:0.08em; margin: 22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
}
.cat-heading:first-child{ margin-top:0; }

.q-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:14px; margin-bottom:10px; }
.q-card.answered{ border-color: var(--line); }
.q-num{ font-family: var(--font-mono); font-size:11px; color: var(--text-faint); margin-bottom:4px; }
.q-text{ font-size:14.5px; line-height:1.45; color: var(--text); margin-bottom:4px; font-weight:500; }
.q-accion{ font-size:12px; color: var(--text-faint); margin-bottom:12px; font-style:italic; }
.q-answers{ display:flex; gap:8px; }
.pill{
  flex:1; border:1px solid var(--line); background: var(--surface-2); border-radius:9px; padding:11px 4px;
  color: var(--text-dim); font-weight:700; font-size:13px; text-align:center;
}
.pill.si.sel{ background: var(--moss); border-color: var(--moss); color:#0E1B12; }
.pill.no.sel{ background: var(--rust-bright); border-color: var(--rust-bright); color:#2A0E08; }
.pill.na.sel{ background: var(--amber); border-color: var(--amber); color:#2A1E04; }
.comment-toggle{
  margin-top:10px; background:none; border:none; color: var(--text-faint); font-size:12px; text-decoration:underline;
  padding:2px 0; font-family: var(--font-mono);
}
textarea.q-comment{
  width:100%; margin-top:8px; background: var(--surface-2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:10px; font-family: var(--font-body); font-size:13.5px; min-height:60px; resize:vertical;
}

.floating-submit{
  position: fixed; bottom:0; left:0; right:0; z-index:30;
  background: linear-gradient(0deg, var(--bg-alt) 60%, rgba(13,23,18,0));
  padding: 22px 18px 18px;
}
.floating-submit .inner{ max-width: 880px; margin:0 auto; display:flex; gap:10px; }

/* HISTORY / DETAIL MODAL */
.modal-backdrop{ position:fixed; inset:0; background: rgba(8,14,11,0.72); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.modal{
  background: var(--bg-alt); border:1px solid var(--line); border-radius: 18px 18px 0 0;
  width:100%; max-width: 880px; max-height: 86vh; overflow-y:auto; padding: 18px 18px 26px;
}
@media(min-width:640px){
  .modal-backdrop{ align-items:center; }
  .modal{ border-radius: 18px; max-height: 80vh; }
}
.modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.modal-close{ background: var(--surface-2); border:1px solid var(--line); color:var(--text-dim); border-radius:8px; padding:8px 10px; font-size:13px; }

.hist-row{
  display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
}
.hist-row .meta{ font-size:12.5px; color:var(--text-dim); }
.hist-row .meta b{ color:var(--text); }
.hist-score{ font-family:var(--font-mono); font-weight:700; padding:6px 10px; border-radius:8px; font-size:13px; }

.detail-q{ padding:10px 0; border-bottom:1px solid var(--line); }
.detail-q:last-child{ border-bottom:none; }
.detail-q .qt{ font-size:13.5px; margin-bottom:4px; }
.detail-tag{ display:inline-block; font-family:var(--font-mono); font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; }
.tag-si{ background: rgba(127,166,90,0.22); color: var(--moss-bright); }
.tag-no{ background: rgba(219,107,78,0.22); color: var(--rust-bright); }
.tag-na{ background: rgba(217,164,65,0.22); color: var(--amber-bright); }
.detail-comment{ font-size:12.5px; color:var(--text-faint); margin-top:4px; }

.empty-state{ text-align:center; padding: 50px 20px; color: var(--text-faint); }
.empty-state .big{ font-family:var(--font-display); font-size:16px; color:var(--text-dim); margin-bottom:6px; font-weight:700; }

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100;
  background: var(--moss); color:#0E1B12; padding:12px 20px; border-radius:10px; font-weight:700; font-size:13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35); opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(6px); }

.small-note{ font-size:11.5px; color: var(--text-faint); margin-top:10px; line-height:1.5; }
</style>
</head>

<script>
// ===================== DATA =====================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzk1jzHaJOWVPqpGAPm_qhzjsl_DG84qfqkcxzNBZlIEPNySwR7tJ2whkNL1c7qFzhF/exec';
const QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
const AREAS = Object.keys(QUESTIONS);
const CAMPINGS = ["MGP 1","MGP 2","MGP 3","MGP 4","MGP 6","MGP 7","MGP 8","MGP 9","MGP 11","MGP 12","MGP 13","MGP 15","MGP 16","Proyecto 1","Proyecto 2"];

const AREA_SHORT = {
  "Dirección":"DIR","Recepción":"REC","Administración":"ADM","Limpieza":"LMP",
  "F&B":"F&B","Mantenimiento":"MNT","Animación":"ANI","Supermercado":"SUP"
};

let STATE = {
  tab: 'dashboard',
  index: [],              // master index of audits (shared)
  drafts: [],             // in-progress drafts saved on this device
  camping: null,
  area: null,
  manager: localStorage.getItem('wecamp_manager') || '',
  answers: {},            // { qn: {respuesta, comentario} }
  modal: null,            // {type:'history', camping, area} or {type:'detail', record}
};

const root = document.getElementById('root');

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast'; t.className='toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

function slug(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_'); }

function getDeviceId(){
  try{
    let id = localStorage.getItem('wecamp_device_id');
    if(!id){ id = 'dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('wecamp_device_id', id); }
    return id;
  }catch(e){
    if(!window.__wecampDeviceId) window.__wecampDeviceId = 'dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    return window.__wecampDeviceId;
  }
}

async function apiGet(params){
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status+' al conectar con la Google Sheet');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body){
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' al conectar con la Google Sheet');
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ===================== STORAGE =====================
async function loadIndex(){
  try{
    const res = await apiGet({action:'get', key:'wecamp:index'});
    STATE.index = res.value ? JSON.parse(res.value) : [];
  }catch(e){ console.error('Error cargando índice:', e); STATE.index = []; STATE.storageError = e.message; }
}

async function saveIndex(){
  await apiPost({action:'set', key:'wecamp:index', value: JSON.stringify(STATE.index)});
}

// Atomic add/update of one entry in the shared index — safe when several
// area managers save at the same time (no risk of overwriting each other).
async function upsertIndexEntry(entry){
  const res = await apiPost({action:'index_upsert', key:'wecamp:index', entry});
  if(res && res.index) STATE.index = res.index;
  return res;
}
async function removeIndexEntry(id){
  const res = await apiPost({action:'index_remove', key:'wecamp:index', id});
  if(res && res.index) STATE.index = res.index;
  return res;
}

async function saveAuditRecord(record){
  await apiPost({action:'set', key:'wecamp:audit:'+record.id, value: JSON.stringify(record)});
}

async function fetchAuditRecord(id){
  try{
    const res = await apiGet({action:'get', key:'wecamp:audit:'+id});
    return res.value ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}

let draftTimer = null;
function draftKey(camping, area){ return 'wecamp:draft:'+getDeviceId()+':'+slug(camping)+':'+slug(area); }
function currentDraftPayload(){
  return JSON.stringify({camping: STATE.camping, area: STATE.area, answers: STATE.answers, manager: STATE.manager, ts: Date.now()});
}
function scheduleDraftSave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>{ flushDraftSave(); }, 600);
}
async function flushDraftSave(){
  clearTimeout(draftTimer);
  if(!STATE.camping || !STATE.area) return;
  if(!STATE.answers || Object.keys(STATE.answers).length===0) return;
  const payload = currentDraftPayload();
  const key = draftKey(STATE.camping, STATE.area);
  try{
    await apiPost({action:'set', key, value: payload});
  }catch(e){
    // one retry after a short pause, in case of a transient backend hiccup
    await new Promise(r=>setTimeout(r, 1200));
    try{
      await apiPost({action:'set', key, value: payload});
    }catch(e2){
      console.error('Error guardando borrador (tras reintento):', e2);
    }
  }
}
async function loadDraft(camping, area){
  try{
    const res = await apiGet({action:'get', key: draftKey(camping, area)});
    return res.value ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function clearDraft(camping, area){
  try{ await apiPost({action:'delete', key: draftKey(camping, area)}); }catch(e){}
}

async function loadAllDrafts(){
  try{
    const res = await apiGet({action:'list', prefix: 'wecamp:draft:'+getDeviceId()+':'});
    if(!res || !res.keys) return [];
    const drafts = [];
    for(const key of res.keys){
      try{
        const r = await apiGet({action:'get', key});
        if(r && r.value){
          const d = JSON.parse(r.value);
          if(d.camping && d.area && d.answers && Object.keys(d.answers).some(k=>d.answers[k] && d.answers[k].respuesta)){
            const totalQ = QUESTIONS[d.area] ? QUESTIONS[d.area].length : 0;
            const answered = Object.values(d.answers).filter(a=>a && a.respuesta).length;
            drafts.push({key, camping:d.camping, area:d.area, manager:d.manager||'', ts:d.ts||0, answered, total: totalQ});
          }
        }
      }catch(e){}
    }
    drafts.sort((a,b)=> b.ts - a.ts);
    return drafts;
  }catch(e){ return []; }
}

async function refreshDrafts(){
  STATE.drafts = await loadAllDrafts();
  if(STATE.tab==='audit' && !STATE.camping) render();
}

// safety net: flush the moment the tab is backgrounded, closed, or navigated away from
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushDraftSave(); });
window.addEventListener('pagehide', ()=>{ flushDraftSave(); });
window.addEventListener('beforeunload', ()=>{ flushDraftSave(); });

// ===================== SCORING =====================
function latestPerPair(){
  // returns map "camping|area" -> latest index entry
  const map = {};
  for(const e of STATE.index){
    const key = e.camping+'|'+e.area;
    if(!map[key] || e.ts > map[key].ts) map[key] = e;
  }
  return map;
}

function campingOverall(camping, latest){
  let si=0, no=0;
  for(const area of AREAS){
    const e = latest[camping+'|'+area];
    if(e){ si += e.si; no += e.no; }
  }
  if(si+no===0) return null;
  return si/(si+no);
}

function pct(v){ return v===null || v===undefined ? '—' : Math.round(v*100)+'%'; }

function cellClass(v){
  if(v===null || v===undefined) return 'cell-empty';
  if(v>=0.9) return 'cell-good';
  if(v>=0.7) return 'cell-mid';
  return 'cell-bad';
}

// ===================== EXCEL EXPORT =====================
function campingComplete(camping, latest){
  return AREAS.every(a => !!latest[camping+'|'+a]);
}

function fmtDateForFile(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function respLabel(r){ return r==='Si'?'Sí':r==='No'?'No':'No aplica'; }

function buildResumenRows(campingsList, latest){
  const header = ['Camping', ...AREAS.map(a=>a), 'TOTAL'];
  const rows = [header];
  campingsList.forEach(camping=>{
    const row = [camping];
    AREAS.forEach(area=>{
      const e = latest[camping+'|'+area];
      row.push(e ? Math.round((e.si/((e.si+e.no)||1))*1000)/10 : '');
    });
    const ov = campingOverall(camping, latest);
    row.push(ov===null ? '' : Math.round(ov*1000)/10);
    rows.push(row);
  });
  return rows;
}

async function exportCampingExcel(camping, triggerBtn){
  const originalLabel = triggerBtn ? triggerBtn.textContent : null;
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.textContent = '…'; }
  try{
    const latest = latestPerPair();
    const records = {};
    for(const area of AREAS){
      const e = latest[camping+'|'+area];
      if(e){
        const rec = await fetchAuditRecord(e.id);
        if(rec) records[area] = rec;
      }
    }

    const wb = XLSX.utils.book_new();

    // Resumen sheet for this camping
    const resumenRows = [['ÁREA','Nº PUNTOS','SÍ','NO','N/A','% CUMPLIMIENTO','AUDITADO POR','FECHA']];
    let totSi=0, totNo=0;
    AREAS.forEach(area=>{
      const rec = records[area];
      if(rec){
        totSi += rec.si; totNo += rec.no;
        resumenRows.push([area, rec.total, rec.si, rec.no, rec.na, Math.round((rec.si/((rec.si+rec.no)||1))*1000)/10, rec.manager, new Date(rec.ts).toLocaleDateString('es-ES')]);
      } else {
        resumenRows.push([area, QUESTIONS[area].length, '', '', '', '', '', '']);
      }
    });
    resumenRows.push([]);
    resumenRows.push(['TOTAL', '', totSi, totNo, '', Math.round((totSi/((totSi+totNo)||1))*1000)/10, '', '']);
    const wsResumen = XLSX.utils.aoa_to_sheet(resumenRows);
    wsResumen['!cols'] = [{wch:18},{wch:11},{wch:8},{wch:8},{wch:8},{wch:16},{wch:16},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

    // One sheet per area with full detail
    AREAS.forEach(area=>{
      const rec = records[area];
      const rows = [['Nº','Categoría','Pregunta','Respuesta','Comentario']];
      const qs = QUESTIONS[area];
      const ansByN = {};
      if(rec) rec.answers.forEach(a=>{ ansByN[a.n] = a; });
      qs.forEach(q=>{
        const a = ansByN[q.n];
        rows.push([q.n, q.categoria, q.pregunta, a ? respLabel(a.respuesta) : '', a ? (a.comentario||'') : '']);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:5},{wch:20},{wch:70},{wch:12},{wch:40}];
      const sheetName = area.length>28 ? area.slice(0,28) : area;
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    XLSX.writeFile(wb, `Auditoria_${slug(camping)}_${fmtDateForFile()}.xlsx`);
    toast('Excel descargado ✓');
  }catch(err){
    console.error('Error exportando Excel:', err);
    toast('⚠ Error al generar el Excel: '+(err && err.message ? err.message : ''));
  }finally{
    if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.textContent = originalLabel; }
  }
}

async function exportGlobalExcel(triggerBtn){
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.textContent = 'Generando...'; }
  try{
    const latest = latestPerPair();
    const wb = XLSX.utils.book_new();

    const resumenRows = buildResumenRows(CAMPINGS, latest);
    const wsResumen = XLSX.utils.aoa_to_sheet(resumenRows);
    wsResumen['!cols'] = [{wch:16}, ...AREAS.map(()=>({wch:10})), {wch:10}];
    XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

    const detailRows = [['Camping','Área','Nº','Categoría','Pregunta','Respuesta','Comentario','Auditado por','Fecha']];
    for(const camping of CAMPINGS){
      for(const area of AREAS){
        const e = latest[camping+'|'+area];
        if(!e) continue;
        const rec = await fetchAuditRecord(e.id);
        if(!rec) continue;
        rec.answers.forEach(a=>{
          detailRows.push([camping, area, a.n, a.categoria, a.pregunta, respLabel(a.respuesta), a.comentario||'', rec.manager, new Date(rec.ts).toLocaleDateString('es-ES')]);
        });
      }
    }
    const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
    wsDetail['!cols'] = [{wch:14},{wch:16},{wch:5},{wch:20},{wch:60},{wch:12},{wch:35},{wch:16},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsDetail, 'Detalle');

    XLSX.writeFile(wb, `Auditoria_WECAMP_Resumen_${fmtDateForFile()}.xlsx`);
    toast('Excel descargado ✓');
  }catch(err){
    console.error('Error exportando Excel:', err);
    toast('⚠ Error al generar el Excel: '+(err && err.message ? err.message : ''));
  }finally{
    if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.textContent = '⬇ Descargar resumen de todo (Excel)'; }
  }
}

// ===================== RENDER: SHELL =====================
function render(){
  root.innerHTML = '';
  root.appendChild(renderHeader());
  const main = document.createElement('main');
  if(STATE.tab==='dashboard') main.appendChild(renderDashboard());
  else if(STATE.tab==='drafts') main.appendChild(renderDraftsTab());
  else main.appendChild(renderAuditFlow());
  root.appendChild(main);
  if(STATE.modal) root.appendChild(renderModal());
}

function renderHeader(){
  const header = document.createElement('header');
  header.className='top';
  header.innerHTML = `
    <div class="wordmark">WECAMP <span class="dot">·</span> <small>Auditorías internas</small></div>
    <div class="tabs">
      <button class="tab ${STATE.tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button>
      <button class="tab ${STATE.tab==='audit'?'active':''}" data-tab="audit">Nueva auditoría</button>
      <button class="tab ${STATE.tab==='drafts'?'active':''}" data-tab="drafts">En curso${STATE.drafts && STATE.drafts.length ? ` <span class="tab-badge">${STATE.drafts.length}</span>` : ''}</button>
    </div>
  `;
  header.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = async ()=>{

}

      const h = document.createElement('div');

    submitBtnEl.textContent = `Guardar auditoría (${count}/${qs.length})`;
    submitBtnEl.disabled = count===0;
  }

  return wrap;
}

function renderQuestionCard(q, onChange){
  const card = document.createElement('div');
  const current = STATE.answers[q.n] || {};
  card.className = 'q-card'+(current.respuesta?' answered':'');

  card.innerHTML = `
    <div class="q-num">Punto ${q.n}${q.responsable?' · '+q.responsable:''}</div>
    <div class="q-text">${q.pregunta}</div>
    ${q.accion ? `<div class="q-accion">Cómo comprobarlo: ${q.accion}</div>` : ''}
    <div class="q-answers">
      <button class="pill si ${current.respuesta==='Si'?'sel':''}" data-v="Si">Sí</button>
      <button class="pill no ${current.respuesta==='No'?'sel':''}" data-v="No">No</button>
      <button class="pill na ${current.respuesta==='No aplica'?'sel':''}" data-v="No aplica">N/A</button>
    </div>
    <button class="comment-toggle">${current.comentario ? 'Editar comentario' : '+ Añadir comentario'}</button>
    <textarea class="q-comment" style="display:${current.comentario?'block':'none'}" placeholder="Comentario / evidencia...">${current.comentario||''}</textarea>
  `;

  card.querySelectorAll('.pill').forEach(p=>{
    p.onclick = ()=>{
      const v = p.dataset.v;
      if(!STATE.answers[q.n]) STATE.answers[q.n] = {};
      STATE.answers[q.n].respuesta = (STATE.answers[q.n].respuesta===v) ? null : v;
      scheduleDraftSave();
      const cur = STATE.answers[q.n].respuesta;
      card.querySelectorAll('.pill').forEach(pp=>pp.classList.remove('sel'));
      if(cur){ card.querySelector(`.pill[data-v="${cur}"]`).classList.add('sel'); }
      card.classList.toggle('answered', !!cur);
      if(onChange) onChange();
    };
  });
  const toggleBtn = card.querySelector('.comment-toggle');
  const textarea = card.querySelector('.q-comment');
  toggleBtn.onclick = ()=>{
    textarea.style.display = textarea.style.display==='none' ? 'block':'none';
    if(textarea.style.display==='block') textarea.focus();
  };
  textarea.oninput = (e)=>{
    if(!STATE.answers[q.n]) STATE.answers[q.n] = {};
    STATE.answers[q.n].comentario = e.target.value;
    scheduleDraftSave();
  };

  return card;
}

async function deleteAuditRecord(r){
  const ok = window.confirm(`¿Seguro que quieres borrar por completo esta auditoría?\n\n${r.camping} · ${r.area} — ${new Date(r.ts).toLocaleDateString('es-ES')}\n\nEsto no se puede deshacer.`);
  if(!ok) return;
  try{
    await apiPost({action:'delete', key:'wecamp:audit:'+r.id});
    await removeIndexEntry(r.id);
    STATE.modal = null;
    toast('Auditoría borrada');
    render();
  }catch(err){
    console.error('Error borrando auditoría:', err);
    toast('⚠ Error al borrar: '+(err && err.message ? err.message : ''));
  }
}

async function saveEditedAudit(r, qs, editAnswers){
  let si=0, no=0, na=0;
  const answersArr = [];
  qs.forEach(q=>{
    const a = editAnswers[q.n];
    if(a && a.respuesta){
      if(a.respuesta==='Si') si++;
      else if(a.respuesta==='No') no++;
      else if(a.respuesta==='No aplica') na++;
      answersArr.push({n:q.n, categoria:q.categoria, pregunta:q.pregunta, respuesta:a.respuesta, comentario:a.comentario||''});
    }
  });

  const updated = Object.assign({}, r, {
    si, no, na, total: qs.length,
    answers: answersArr,
    updatedTs: Date.now()
  });

  await saveAuditRecord(updated);

  const existing = STATE.index.find(e=>e.id===r.id);
  if(existing){
    await upsertIndexEntry(Object.assign({}, existing, {si, no, na, total: qs.length}));
  }

  toast('Cambios guardados ✓');
  STATE.modal = {type:'detail', record: updated, editing:false};
  render();
}

  STATE.modal = {type:'exitConfirm'};
  render();
}

async function exitSaveDraft(){
  await flushDraftSave();
  STATE.camping=null; STATE.area=null; STATE.answers={}; STATE.modal=null;
  toast('Borrador guardado');
  await refreshDrafts();
  render();
}

async function exitDiscard(){

  STATE.camping=null; STATE.area=null; STATE.answers={}; STATE.modal=null;

  render();
}

async function startAudit(camping, area){
  STATE.camping = camping;
  STATE.area = area;
  STATE.answers = {};
  STATE.tab = 'audit';
  const draft = await loadDraft(camping, area);
  if(draft && draft.answers && Object.keys(draft.answers).length){
    STATE.answers = draft.answers;
    toast('Borrador recuperado');
  }
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

async function submitAudit(){
  const btn = document.getElementById('submitAuditBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  try{
    const qs = QUESTIONS[STATE.area];
    let si=0, no=0, na=0;
    const answersArr = [];
    qs.forEach(q=>{
      const a = STATE.answers[q.n];
      if(a && a.respuesta){
        if(a.respuesta==='Si') si++;
        else if(a.respuesta==='No') no++;
        else if(a.respuesta==='No aplica') na++;
        answersArr.push({n:q.n, categoria:q.categoria, pregunta:q.pregunta, respuesta:a.respuesta, comentario:a.comentario||''});
      }
    });

    const record = {
      id: slug(STATE.camping)+'__'+slug(STATE.area)+'__'+Date.now(),
      camping: STATE.camping,
      area: STATE.area,
      manager: STATE.manager || 'Sin nombre',
      ts: Date.now(),
      date: new Date().toISOString(),
      si, no, na,
      total: qs.length,
      answers: answersArr
    };

    await saveAuditRecord(record);

    await upsertIndexEntry({ id:record.id, camping:record.camping, area:record.area, manager:record.manager, ts:record.ts, si, no, na, total: qs.length });
    await clearDraft(STATE.camping, STATE.area);

    toast('Auditoría guardada ✓');
    STATE.camping = null; STATE.area = null; STATE.answers = {}; STATE.pickCamping=null; STATE.pickArea=null;
    STATE.tab = 'dashboard';
    await refreshDrafts();
    render();
  }catch(err){
    console.error('Error guardando auditoría:', err);
    toast('⚠ Error al guardar: '+(err && err.message ? err.message : 'inténtalo de nuevo'));
    if(btn){ btn.disabled = false; btn.textContent = 'Reintentar guardado'; }
  }
}

    const {camping} = STATE.modal;

    modal.innerHTML = `<div class="modal-head">

      </div>`;

    if(STATE.modal.type==='campingHistory'){
      const expBtn = document.createElement('button');
      expBtn.className = 'btn btn-outline-amber';
      expBtn.style.marginBottom = '14px';
      expBtn.id = 'campExportBtn';
      expBtn.textContent = '⬇ Descargar Excel de este camping';
      expBtn.onclick = ()=> exportCampingExcel(camping, expBtn);
      modal.appendChild(expBtn);
    }

    const list = document.createElement('div');
    if(entries.length===0){
      list.innerHTML = `<div class="empty-state"><div class="big">Sin auditorías todavía</div>Empieza una nueva desde la pestaña "Nueva auditoría".</div>`;
    }
    entries.forEach(e=>{
      const v = e.si/((e.si+e.no)||1);
      const row = document.createElement('div');
      row.className='hist-row';
      row.innerHTML = `
        <div class="meta"><b>${e.area}</b><br>${new Date(e.ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})} · ${e.manager}</div>
        <div class="hist-score" style="background:${cellClass(v)==='cell-good'?'rgba(154,201,109,.2);color:var(--moss-bright)':cellClass(v)==='cell-mid'?'rgba(217,164,65,.2);color:var(--amber-bright)':'rgba(219,107,78,.2);color:var(--rust-bright)'}">${pct(v)}</div>
      `;
      row.onclick = async ()=>{
        const rec = await fetchAuditRecord(e.id);
        STATE.modal = {type:'detail', record: rec};
        render();
      };
      list.appendChild(row);
    });
    modal.appendChild(list);
  }

  if(STATE.modal.type==='detail' && !STATE.modal.editing){
    const r = STATE.modal.record;
    modal.innerHTML = `<div class="modal-head">
        <div><div class="card-title" style="margin-bottom:2px">${r.camping} · ${r.area}</div>
        <div class="small-note" style="margin-top:0">${new Date(r.ts).toLocaleString('es-ES')}${r.updatedTs?' · editado '+new Date(r.updatedTs).toLocaleString('es-ES'):''} · Auditado por ${r.manager}</div></div>
        <button class="modal-close" id="closeModal">Cerrar</button>
      </div>`;
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-outline-amber';
    editBtn.textContent = '✎ Editar respuestas';
    editBtn.onclick = ()=>{
      const ansMap = {};
      r.answers.forEach(a=>{ ansMap[a.n] = {respuesta:a.respuesta, comentario:a.comentario}; });
      STATE.modal.editing = true;
      STATE.modal.editAnswers = ansMap;
      render();
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-ghost';
    delBtn.style.cssText = 'color:var(--rust-bright); border-color:var(--rust-bright);';
    delBtn.textContent = '🗑 Borrar auditoría';
    delBtn.onclick = ()=> deleteAuditRecord(r);

    const actionsRow = document.createElement('div');
    actionsRow.style.cssText = 'display:flex; gap:10px; margin-bottom:14px;';
    actionsRow.appendChild(editBtn);
    actionsRow.appendChild(delBtn);
    modal.appendChild(actionsRow);

    const list = document.createElement('div');
    r.answers.forEach(a=>{
      const d = document.createElement('div');
      d.className='detail-q';
      const tagClass = a.respuesta==='Si'?'tag-si':a.respuesta==='No'?'tag-no':'tag-na';
      const tagText = a.respuesta==='Si'?'SÍ':a.respuesta==='No'?'NO':'N/A';
      d.innerHTML = `<div class="qt">${a.pregunta}</div><span class="detail-tag ${tagClass}">${tagText}</span>${a.comentario?`<div class="detail-comment">${a.comentario}</div>`:''}`;
      list.appendChild(d);
    });
    modal.appendChild(list);
  }

  if(STATE.modal.type==='detail' && STATE.modal.editing){
    const r = STATE.modal.record;
    const qs = QUESTIONS[r.area];
    const editAnswers = STATE.modal.editAnswers;

    modal.innerHTML = `<div class="modal-head">
        <div><div class="card-title" style="margin-bottom:2px">Editando: ${r.camping} · ${r.area}</div>
        <div class="small-note" style="margin-top:0">Auditado por ${r.manager} el ${new Date(r.ts).toLocaleDateString('es-ES')}</div></div>
        <button class="modal-close" id="closeModal">Cerrar</button>
      </div>`;

    const formWrap = document.createElement('div');
    let lastCat = null;
    qs.forEach(q=>{
      if(q.categoria !== lastCat){
        const h = document.createElement('div');
        h.className='cat-heading';
        h.textContent = q.categoria;
        formWrap.appendChild(h);
        lastCat = q.categoria;
      }
      formWrap.appendChild(renderEditableQuestionCard(q, editAnswers));
    });
    modal.appendChild(formWrap);

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:10px; margin-top:16px; position:sticky; bottom:0; background:var(--bg-alt); padding-top:10px;';
    actions.innerHTML = `
      <button class="btn btn-ghost" id="cancelEditBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveEditBtn">Guardar cambios</button>
    `;
    modal.appendChild(actions);

    setTimeout(()=>{
      document.getElementById('cancelEditBtn').onclick = ()=>{ STATE.modal.editing = false; render(); };
      document.getElementById('saveEditBtn').onclick = ()=> saveEditedAudit(r, qs, editAnswers);
    }, 0);
  }

  if(STATE.modal.type==='exitConfirm'){
    const qs = QUESTIONS[STATE.area];
    const answeredCount = qs.filter(q=>STATE.answers[q.n] && STATE.answers[q.n].respuesta).length;
    modal.innerHTML = `<div class="modal-head">
        <div><div class="card-title" style="margin-bottom:2px">Salir de la auditoría</div>
        <div class="small-note" style="margin-top:0">${STATE.camping} · ${STATE.area} — has respondido ${answeredCount} de ${qs.length}. ¿Qué quieres hacer?</div></div>
      </div>`;
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; flex-direction:column; gap:10px; margin-top:6px;';
    actions.innerHTML = `
      <button class="btn btn-primary" id="exitSaveBtn">Guardar sin completar y salir</button>
      <button class="btn btn-outline-amber" id="exitDiscardBtn" style="border-color:var(--rust-bright); color:var(--rust-bright);">Borrar lo hecho y salir</button>
      <button class="btn btn-ghost" id="exitCancelBtn">Seguir editando</button>
    `;
    modal.appendChild(actions);
    setTimeout(()=>{
      document.getElementById('exitSaveBtn').onclick = exitSaveDraft;
      document.getElementById('exitDiscardBtn').onclick = exitDiscard;
      document.getElementById('exitCancelBtn').onclick = ()=>{ STATE.modal=null; render(); };
    }, 0);
  }

  backdrop.appendChild(modal);
  setTimeout(()=>{
    const closeBtn = document.getElementById('closeModal');
    if(closeBtn) closeBtn.onclick = ()=>{ STATE.modal=null; render(); };
  }, 0);
  return backdrop;
}

// ===================== INIT =====================
(async function init(){
  root.innerHTML = `<div class="empty-state"><div class="big">Cargando auditorías…</div></div>`;
  await loadIndex();
  await refreshDrafts();
  render();

  // auto-refresh the dashboard periodically so audits saved by other area
  // managers show up without needing a manual reload, but never while
  // someone is mid-questionnaire (would disrupt their in-progress answers)
  setInterval(async ()=>{
    if(STATE.tab==='dashboard' && !STATE.modal){
      await loadIndex();
      if(STATE.tab==='dashboard' && !STATE.modal) render();
    }
  }, 20000);
})();

</script>
</body>
</html>
